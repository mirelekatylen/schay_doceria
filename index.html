<DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schay Doceria</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- FONTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- ÍCONES (Font Awesome)-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="mobile-frame">

    <!-- CABEÇALHO -->
    <header class="app-header">
        <h1 class="brand-title">Schay Doceria</h1>
    </header>

    <main class="app-content">
        <section id="inicio" class="tab-content active">

            <h2>Boas-vindas!</h2>

            <p>Os doces mais especiais feito com carinho para você.</p>

            <div class="banner-placeholder">
                <span>Destaque do Dia</span>
            </div>

        </section>

        <section id="buscar" class="tab-content">

            <h2>Buscar</h2>

            <input type="text" placeholder="Procure um doce ou bolo..." class="search-input">

        </section>

        <section id="cardapio" class="tab-content">

            <h2>Nosso Cardápio</h2>

            <p>Selecione suas delicias favoritas.</p>

        </section>

        <section id="agenda" class="tab-content">

            <h2>Agenda de Encomendas</h2>

            <p>Entre em contato diretamente pelo WhatsApp.</p>

        </section>

    </main>

    <!-- BARRA DE NAVEGAÇÃO INFERIOR FIXA -->
    <nav class="bottom-nav">

        <a href="#inicio" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Início</span>
        </a>

        <a href="#buscar" class="nav-item">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Buscar</span>
        </a>

        <a href="#cardapio" class="nav-item">
            <i class="fa-solid fa-utensils"></i>
            <span>Cardápio</span>
        </a>

        <a href="#agenda" class="nav-item">
            <i class="fa-solid fa-calendar-days"></i>
            <span>Agenda</span>
        </a>

        <a href="#contato" class="nav-item">
            <i class="fa-solid fa-comments"></i>
            <span>Contatos</span>
        </a>        

    </nav>

    </div>

</body>

</html>
